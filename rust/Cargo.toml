[package]
name = "secmail"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Secure mail gateway (Rust port of the Go secmail) — DLP, inbound auth, quarantine portal"
license = "MIT"

[lib]
name = "secmail"
path = "src/lib.rs"

[[bin]]
name = "secmail"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde_yml = "0.0.12"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std", "serde"] }
aes-gcm = "0.10.3"
rand = "0.8.5"
rsa = { version = "0.9.8", features = ["sha2"] }
sha2 = "0.10.9"
hmac = "0.12.1"
base64 = "0.22.1"

[dev-dependencies]
