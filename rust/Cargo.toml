[package]
name = "secmail"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Secure mail gateway (Rust port of the Go secmail) — DLP, inbound auth, quarantine portal"
license = "MIT"

[lib]
name = "secmail"
path = "src/lib.rs"

[[bin]]
name = "secmail"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde_yml = "0.0.12"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std", "serde"] }
aes-gcm = "0.10.3"
rand = "0.8.5"
rsa = { version = "0.9.8", features = ["sha2"] }
sha2 = "0.10.9"
hmac = "0.12.1"
base64 = "0.22.1"
regex = "1.11.3"
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "fs"] }
async-trait = "0.1.89"
uuid = { version = "1.18.1", features = ["v4"] }
prometheus = "0.13.4"
axum = "0.8.6"
mailparse = "0.16.1"
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14.1"
redis = { version = "0.32.5", default-features = false, features = ["tokio-comp", "aio"] }
hickory-resolver = { version = "0.25.2", features = ["tokio"] }
psl = "2.1.120"
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.2"

[dev-dependencies]
