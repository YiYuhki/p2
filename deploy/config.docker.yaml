# Configuration used by deploy/docker-compose.yml (local demo only).
timezone: Asia/Seoul
smtp:
  listen: ":2525"
  hostname: secmail.local
  accepted_domains: [example.com]
upstream:
  addr: mailpit:1025          # stand-in for the real mail server
  timeout: 30s
dkim:
  verify_inbound: false
  sign: false
portal:
  listen: ":8080"
  public_base_url: http://localhost:8080
  auth:
    mode: otp                  # recipients prove ownership with a mailed code
    session_secret: ${SECMAIL_SESSION_SECRET}
    otp_from: no-reply@example.com
internal_api:
  listen: ":8081"
  token: ${SECMAIL_INTERNAL_TOKEN}
  admin_token: ${SECMAIL_ADMIN_TOKEN}
  advertise_url: http://secmail:8081
storage:
  type: s3
  s3:
    endpoint: s3:9000
    region: us-east-1
    bucket: secmail-attachments
    access_key: ${S3_ACCESS_KEY}
    secret_key: ${S3_SECRET_KEY}
    use_ssl: false
database:
  type: postgres
  dsn: postgres://secmail:secmail@postgres:5432/secmail?sslmode=disable
redis:
  addr: redis:6379
  password: ${SECMAIL_REDIS_PASSWORD}   # redis runs with requirepass
queue:
  type: redis
analysis:
  timeout: 1m
  janitor_interval: 10s

# Outgoing mail inspection (DLP). In the demo, mail submitted to :10025 is
# scanned and relayed to mailpit, which stands in for the Internet.
outbound:
  enabled: true
  listen: ":10025"
  # This listener relays to the Internet without authentication, so only the
  # internal MTA may use it. In this demo there is no MTA container: you submit
  # from the docker host via the loopback-only published port, and Docker's
  # port proxy delivers those connections from the network gateway
  # (172.28.0.1, fixed in docker-compose.yml). Other containers on the network
  # (172.28.0.2-254) are refused. Never list whole private ranges here: a
  # port published on 0.0.0.0 arrives from the gateway too, which would turn
  # the gateway entry into an open relay. In production list your MTA's IPs.
  allowed_clients: ["127.0.0.1/32", "172.28.0.1/32"]
  next_hop:
    addr: mailpit:1025
dlp:
  scan_attachments: true
  actions:
    high: hold          # resident numbers, cards, API keys, private keys
    medium: notify      # passports, licences, bulk phone lists, JWTs, passwords
    low: allow
    uninspectable: notify
  notify_sender: true
  admins: [security@example.com]
  notify_from: dlp-noreply@example.com
  hold_ttl: 72h
  ocr:
    enabled: true   # tesseract + Korean data ship in the image
