# Dovecot config for the secmail demo backend. Serves IMAP to mail clients and
# accepts local delivery over LMTP from Postfix. DEMO ONLY: no TLS, plaintext
# auth, passwords stored in a flat file.
protocols = imap lmtp
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout

# TLS (ssl=, ssl_cert/ssl_key, the imaps listener) is appended by entrypoint.sh
# when TLS_ENABLED=true. Plaintext auth stays allowed so clients can also log in
# over :143 without TLS in the demo.
disable_plaintext_auth = no
auth_mechanisms = plain login

# One Maildir per user under /var/mail/vhosts/<domain>/<localpart>.
mail_location = maildir:/var/mail/vhosts/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_privileged_group = vmail

namespace inbox {
  inbox = yes
}

# Users come from a flat passwd-file generated by entrypoint.sh from MAIL_USERS.
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
  default_fields = uid=vmail gid=vmail home=/var/mail/vhosts/%d/%n
}

# LMTP delivery endpoint used by Postfix's virtual_transport.
service lmtp {
  inet_listener lmtp {
    address = 0.0.0.0
    port = 24
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  # The imaps (:993) listener is added by entrypoint.sh when TLS is enabled.
}

# SASL auth socket for Postfix's submission (:587) service.
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
