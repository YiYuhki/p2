# Local demo stack:
#   docker compose -f deploy/docker-compose.yml up --build
#   send mail to localhost:2525 (rcpt @example.com), read it at http://localhost:8025
name: secmail
x-env: &env
  SECMAIL_INTERNAL_TOKEN: demo-internal-token-change-me
  MINIO_ROOT_USER: secmail
  MINIO_ROOT_PASSWORD: secmail-minio-secret

services:
  secmail:
    build: ..
    environment: *env
    volumes:
      - ./config.docker.yaml:/etc/secmail/config.yaml:ro
    ports:
      - "2525:2525"   # SMTP in
      - "8080:8080"   # download portal
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}
      mailpit: {condition: service_started}
    restart: unless-stopped

  # Replace with the real static-analysis project.
  mock-analyzer:
    build: ..
    entrypoint: ["/usr/local/bin/mock-analyzer", "-redis", "redis:6379"]
    environment: *env
    depends_on: [redis, secmail]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secmail
      POSTGRES_PASSWORD: secmail
      POSTGRES_DB: secmail
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secmail"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: *env
    ports: ["9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]   # web UI showing what the "real" mail server received

volumes:
  pgdata:
  miniodata:
