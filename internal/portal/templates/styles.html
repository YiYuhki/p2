{{define "style"}}<style nonce="{{.Nonce}}">
  :root { --fg:#1f2937; --muted:#6b7280; --bg:#f3f4f6; --card:#fff; --line:#e5e7eb;
          --ok:#059669; --warn:#d97706; --bad:#dc2626; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e5e7eb; --muted:#9ca3af; --bg:#111827; --card:#1f2937; --line:#374151; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
  main { max-width:560px; margin:8vh auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { line-height:1.6; margin:8px 0; word-break:keep-all; overflow-wrap:anywhere; }
  h1 { word-break:keep-all; }
  .file { margin:16px 0; padding:12px 14px; border:1px solid var(--line); border-radius:8px;
          word-break:break-all; }
  .file small { color:var(--muted); }
  .badge { display:inline-block; font-size:12px; font-weight:bold; padding:2px 8px;
           border-radius:999px; color:#fff; }
  .PENDING .badge { background:var(--warn); } .CLEAN .badge { background:var(--ok); }
  .MALICIOUS .badge, .ERROR .badge { background:var(--bad); }
  .EXPIRED .badge, .NOTFOUND .badge, .FAILURE .badge { background:var(--muted); }
  button { width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent);
           color:#fff; font-size:15px; font-weight:bold; cursor:pointer; }
  button[disabled] { opacity:.45; cursor:not-allowed; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--warn);
             border-right-color:transparent; border-radius:50%; animation:spin 1s linear infinite;
             vertical-align:-2px; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .threat { color:var(--bad); font-weight:bold; }
  .LOGIN .badge, .CODE .badge, .AUTHREQ .badge { background:var(--accent); }
  .FORBIDDEN .badge { background:var(--bad); }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
          background:var(--bg); color:var(--fg); font-size:15px; margin-bottom:12px; }
  input.code { letter-spacing:6px; font-size:20px; text-align:center; }
  .msg { padding:10px 12px; border-radius:8px; font-size:14px; margin:12px 0; }
  .msg.err { background:rgba(220,38,38,.1); color:var(--bad); }
  .msg.info { background:rgba(79,70,229,.1); }
  .userbar { display:flex; justify-content:space-between; align-items:center; gap:8px;
             margin-top:16px; font-size:12px; color:var(--muted); }
  .link { background:none; border:0; padding:0; width:auto; color:var(--accent);
          font-size:12px; font-weight:normal; text-decoration:underline; }
  .secondary { margin-top:8px; background:transparent; color:var(--accent); border:1px solid var(--line); }
  footer { margin-top:16px; color:var(--muted); font-size:12px; text-align:center; }
  .kv { display:grid; grid-template-columns:72px 1fr; gap:6px 12px; font-size:14px; margin:12px 0; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; word-break:break-all; }
  table.f { width:100%; border-collapse:collapse; font-size:13px; margin:12px 0; }
  table.f th, table.f td { text-align:left; padding:6px 4px; border-top:1px solid var(--line); vertical-align:top; }
  table.f th { color:var(--muted); font-weight:normal; }
  .sev { display:inline-block; padding:1px 6px; border-radius:4px; color:#fff; font-size:11px; }
  .sev.high { background:var(--bad); } .sev.medium { background:var(--warn); } .sev.low { background:var(--muted); }
  .row2 { display:flex; gap:8px; } .row2 form { flex:1; }
  button.danger { background:var(--bad); }
  .HELD .badge { background:var(--warn); } .RELEASED .badge { background:var(--ok); }
  .REJECTED .badge, .EXPIRED .badge { background:var(--muted); }
  /* admin dashboard */
  body.admin main { max-width:960px; }
  .toolbar { display:flex; align-items:center; gap:12px; margin:8px 0 16px; flex-wrap:wrap; }
  .toolbar label { display:inline; margin:0; }
  .toolbar select { padding:8px 10px; border:1px solid var(--line); border-radius:8px;
                    background:var(--bg); color:var(--fg); font-size:14px; }
  .toolbar .count { color:var(--muted); font-size:13px; margin-left:auto; }
  table.holds { width:100%; border-collapse:collapse; font-size:13px; }
  table.holds th, table.holds td { text-align:left; padding:8px 6px; border-top:1px solid var(--line);
                                   vertical-align:top; word-break:break-all; }
  table.holds th { color:var(--muted); font-weight:normal; white-space:nowrap; }
  table.holds tr.decided { opacity:.55; }
  .acts { display:flex; gap:6px; white-space:nowrap; }
  .acts button { width:auto; padding:6px 10px; font-size:12px; }
  .reason { width:100%; margin:6px 0 0; padding:6px 8px; font-size:12px; }
  .pill { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; color:#fff; }
  .pill.HELD { background:var(--warn); } .pill.RELEASED { background:var(--ok); }
  .pill.REJECTED, .pill.EXPIRED { background:var(--muted); }
  .more { width:auto; padding:8px 16px; margin:16px auto 0; display:block; background:transparent;
          color:var(--accent); border:1px solid var(--line); }
  .empty { color:var(--muted); text-align:center; padding:24px 0; }
</style>{{end}}
