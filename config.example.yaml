# secmail example configuration.
# ${VAR} references are expanded from the environment at load time.

timezone: Asia/Seoul            # used for dates shown in banners / portal

smtp:
  listen: ":25"
  hostname: secmail.example.com  # EHLO name and Received / Authentication-Results authserv-id
  accepted_domains:              # recipients outside these domains are refused (no open relay)
    - example.com
    - .example.com               # leading dot = any subdomain
  max_message_bytes: 52428800    # 50 MiB
  max_recipients: 100
  max_line_length: 2000          # reject over-long SMTP lines
  max_connections: 1024          # concurrent connections per listener (0 = unlimited)
  max_connections_per_ip: 50     # concurrent connections per client IP on the inbound listener
  read_timeout: 60s
  write_timeout: 60s
  tls_cert_file: /etc/secmail/tls.crt   # enables inbound STARTTLS (recommended)
  tls_key_file: /etc/secmail/tls.key

upstream:                        # the real mail server (Exchange, Postfix, ...)
  addr: mail.internal.example.com:25
  helo_name: secmail.example.com
  starttls: true
  insecure_skip_verify: false
  timeout: 60s

rewrite:
  gateway_id: secmail-01
  keep_inline_images: true       # keep image/* parts with Content-ID (HTML-embedded images)
  signed_policy: rewrite         # rewrite | passthrough  (rewrite removes the S/MIME/PGP signature)
  encrypted_policy: passthrough  # passthrough | reject    (encrypted content cannot be inspected)
  # blocked_extensions: [exe, scr, bat, cmd, com, pif, js, jse, vbs, wsf, hta]  # refused up front (never released)

dkim:
  verify_inbound: true           # verify original signatures and record them in Authentication-Results
  strip_original: true           # rename broken original DKIM-Signature headers on rewritten mail
  sign: true                     # re-sign rewritten mail with the gateway key
  domain: example.com
  selector: secmail
  private_key_file: /etc/secmail/dkim.key   # generate with: secmail dkim-keygen

spf:
  verify_inbound: true           # check the sending IP against the MAIL FROM domain's SPF record
  timeout: 10s                   # per-message DNS budget (SPF may do several lookups)
  # Result is added to Authentication-Results next to dkim= (e.g. "spf=pass smtp.mailfrom=..."),
  # giving the internal server both inputs for DMARC. Requires outbound DNS from the gateway.

dmarc:
  verify_inbound: true           # evaluate DMARC alignment from the SPF+DKIM results
  timeout: 5s                    # DNS budget for the _dmarc policy lookup
  enforce: false                 # true: reject (550) a DMARC-fail under the domain's p=reject policy
  # Adds "dmarc=pass|fail header.from=..." to Authentication-Results. Requires spf and/or
  # dkim verify_inbound. With enforce=false the gateway only records the result (the internal
  # mail server decides); enforce=true hard-rejects p=reject failures at the gateway.

portal:
  listen: ":8080"
  public_base_url: https://sec-mail.example.com   # used in the links inserted into mail
  link_ttl: 336h                 # 14 days; objects are deleted afterwards
  ticket_ttl: 60s                # one-time download ticket lifetime
  rate_limit_rps: 5              # per-IP cap on all token lookups
  rate_limit_burst: 20
  enum_per_ip_burst: 10          # missed (unknown) tokens per IP before throttling — anti-guessing
  enum_global_rps: 20            # aggregate miss rate across all IPs (defeats distributed guessing)
  trust_proxy_headers: true      # behind a reverse proxy / load balancer
  auth:                          # recipient authentication (see docs/deployment.md)
    mode: otp                    # none | otp | header
    session_secret: ${SECMAIL_SESSION_SECRET}   # >= 32 chars, signs the session cookie
    session_ttl: 12h
    allow_domain_users: false    # true: any user of smtp.accepted_domains (distribution lists)
    otp_from: no-reply@example.com
    otp_ttl: 10m
    otp_max_attempts: 5
    otp_resend_after: 1m
    # trusted_header: X-Auth-Request-Email   # header mode (SSO reverse proxy)

internal_api:                    # used by the external analysis engine only
  listen: "0.0.0.0:8081"
  token: ${SECMAIL_INTERNAL_TOKEN}
  advertise_url: http://secmail-internal.example.com:8081
  # /metrics (Prometheus), /healthz (liveness), /readyz (DB+storage readiness)
  # are served on this internal listener with no auth — keep it internal-only.
  admin_token: ${SECMAIL_ADMIN_TOKEN}   # DLP admin endpoints (/internal/v1/dlp/*); must differ from token

storage:
  type: s3                       # s3 (AWS S3 / MinIO / RustFS / Ceph RGW) | fs
  s3:
    endpoint: minio.internal.example.com:9000
    region: us-east-1
    bucket: secmail-attachments
    access_key: ${SECMAIL_S3_ACCESS_KEY}
    secret_key: ${SECMAIL_S3_SECRET_KEY}
    use_ssl: true
  fs:
    dir: /var/lib/secmail/objects

database:
  type: postgres                 # postgres | memory
  dsn: ${SECMAIL_DATABASE_DSN}   # postgres://user:pass@host:5432/secmail?sslmode=require
  max_conns: 20                  # pool size per instance (0 = pgx default)
  min_conns: 2                   # warm connections kept open
  conn_max_lifetime: 30m         # recycle connections (avoids stale server-side state)
  # At startup the gateway waits up to 30s (exponential backoff) for the
  # database, storage and Redis to become reachable before giving up.

redis:
  addr: redis.internal.example.com:6379
  password: ${SECMAIL_REDIS_PASSWORD}
  db: 0
  pool_size: 0                   # 0 = go-redis default (10×CPU)

queue:
  type: redis                    # redis | memory
  key_prefix: secmail

analysis:
  timeout: 2m                    # PENDING longer than this is re-queued
  max_attempts: 3                # then marked ERROR (download blocked, fail-closed)
  verdict_reuse_window: 24h      # reuse verdicts for identical SHA-256 (0 disables)
  janitor_interval: 1m
  audit_retention: 0s            # delete dlp_events/download_events older than this (0 = keep forever, e.g. 2160h = 90d)

# Optional IN-PROCESS attachment analyzer (embeds the malengine engine). It is
# compiled in only when secmail is built with `-tags malengine` (the default
# build has no engine and relies on the external worker, analyzer/). It consumes
# the queue and applies verdicts exactly like the external worker, so it works
# with both the redis and memory queues — including single-process dev where no
# external worker can attach. A tagged build links libyara via cgo.
analyzer:
  enabled: false                 # no effect unless built with -tags malengine
  yara_dir: ""                   # YARA rule dir (empty: skip YARA, other detectors still run)
  block_level: suspicious        # map this malengine level or worse to MALICIOUS: clean|suspicious|likely|malicious
  threat_intel: false            # outbound reputation lookups (abuse.ch, VirusTotal)
  sandbox: false                 # dynamic sandbox stage (needs Docker/Firecracker)
  max_file_size: 0               # cap analyzed bytes (0: engine default)
  workers: 1                     # concurrent analysis goroutines

# ---- Outgoing mail inspection (DLP) — see docs/dlp.md ----
outbound:
  enabled: true
  listen: ":10025"                 # the internal mail server relays Internet-bound mail here
  allowed_clients:                 # only these hosts may relay (internal mail servers)
    - 10.0.5.10/32
  # sender_domains: [example.com]  # default: smtp.accepted_domains
  next_hop:                        # where inspected mail goes: Postfix re-injection port / smart host
    addr: 10.0.5.10:10026
    starttls: false
    timeout: 60s
  max_message_bytes: 52428800

dlp:
  scan_attachments: true           # docx/xlsx/pptx, hwp/hwpx, pdf, zip/gzip/tar/7z/rar (nested), csv/txt, legacy doc/xls
  # sevenzip_command: 7z           # 7z/rar/xz/zstd extraction (auto-detected on PATH; "none" disables)
  scan_internal: false             # true: also inspect mail between internal addresses
  dry_run: false                 # true: record decisions + metrics but relay anyway (tune before enforcing)
  actions:                         # allow | notify | hold | block
    high: hold                     # resident/alien reg. no., card no., API keys, private keys, DB credentials
    medium: notify                 # passport, licence, business/corp reg. no., bank account, IBAN, bulk phones, JWT, passwords
    low: allow                     # bulk e-mail addresses (logged only)
    uninspectable: notify          # formats that cannot be inspected (distribution-protected HWP, unknown)
    encrypted: hold                # password-protected attachments (zip/7z/rar/PDF/Office); "" = same as uninspectable
  combine_pii: true                # escalate an identity-revealing dataset to high (see below)
  combine_min_pii: 2               # >= this many distinct PII types in one place -> high
  combine_bulk: 20                 # >= this many records of a single type in one place -> high
  notify_sender: true
  admins: [security@example.com]   # receive notices; approve/reject holds on the portal
  notify_from: dlp-noreply@example.com
  hold_ttl: 72h                    # undecided holds are discarded (not sent) after this
  ocr:                             # read text in images: screenshots, photos, scanned PDFs,
    enabled: true                  # pictures pasted into docx/xlsx/pptx/hwp (needs tesseract + kor data)
    command: tesseract
    languages: kor+eng
    psm: 4                         # tesseract page segmentation mode
    max_images: 20                 # distinct images per message (rest reported as uninspectable)
    min_pixels: 9000               # skip icons / logos smaller than this (w*h)
    timeout: 20s                   # per image
    total_timeout: 60s             # per message
    concurrency: 2                 # images OCR'd in parallel per message
    max_processes: 4               # tesseract processes for the whole server
    # external converters (auto-detected on PATH; "none" disables):
    # heif_command: heif-dec         # HEIC/AVIF photos (libheif)
    # pdf_render_command: pdftoppm   # JBIG2/JPEG2000 scans, restricted PDFs (poppler)
    # pdf_text_command: pdftotext    # text layer of PDFs the built-in parser rejects
    pdf_max_pages: 10              # pages rendered per PDF
    pdf_scale_to: 2400             # rendered page long side in pixels (~A4 @ 200 dpi)
  # disabled: [jwt, email_address]         # built-in detector IDs to turn off
  # min_counts: {kr_mobile: 10}            # bulk thresholds per location
  # exempt_senders: [payroll-bot@example.com]
  # exempt_recipient_domains: [payroll-partner.co.kr]   # trusted partners: logged, not held
  # rules:                                 # organisation-specific patterns
  #   - id: project_codename
  #     name: 프로젝트 코드명
  #     pattern: 'PRJ-(ORION-\d{3})'
  #     severity: high
  #     category: confidential

webhook:                         # optional: POST security events (DLP decisions, malware verdicts) as JSON
  url: ""                        # e.g. https://siem.internal/secmail ; empty disables
  secret: ${SECMAIL_WEBHOOK_SECRET}   # optional HMAC-SHA256 signing secret (X-Secmail-Signature header)
  timeout: 5s
