# secmail example configuration.
# ${VAR} references are expanded from the environment at load time.

timezone: Asia/Seoul            # used for dates shown in banners / portal

smtp:
  listen: ":25"
  hostname: secmail.example.com  # EHLO name and Received / Authentication-Results authserv-id
  accepted_domains:              # recipients outside these domains are refused (no open relay)
    - example.com
    - .example.com               # leading dot = any subdomain
  max_message_bytes: 52428800    # 50 MiB
  max_recipients: 100
  read_timeout: 60s
  write_timeout: 60s
  tls_cert_file: /etc/secmail/tls.crt   # enables inbound STARTTLS (recommended)
  tls_key_file: /etc/secmail/tls.key

upstream:                        # the real mail server (Exchange, Postfix, ...)
  addr: mail.internal.example.com:25
  helo_name: secmail.example.com
  starttls: true
  insecure_skip_verify: false
  timeout: 60s

rewrite:
  gateway_id: secmail-01
  keep_inline_images: true       # keep image/* parts with Content-ID (HTML-embedded images)
  signed_policy: rewrite         # rewrite | passthrough  (rewrite removes the S/MIME/PGP signature)
  encrypted_policy: passthrough  # passthrough | reject    (encrypted content cannot be inspected)

dkim:
  verify_inbound: true           # verify original signatures and record them in Authentication-Results
  strip_original: true           # rename broken original DKIM-Signature headers on rewritten mail
  sign: true                     # re-sign rewritten mail with the gateway key
  domain: example.com
  selector: secmail
  private_key_file: /etc/secmail/dkim.key   # generate with: secmail dkim-keygen

portal:
  listen: ":8080"
  public_base_url: https://sec-mail.example.com   # used in the links inserted into mail
  link_ttl: 336h                 # 14 days; objects are deleted afterwards
  ticket_ttl: 60s                # one-time download ticket lifetime
  rate_limit_rps: 5
  rate_limit_burst: 20
  trust_proxy_headers: true      # behind a reverse proxy / load balancer
  auth:                          # recipient authentication (see docs/deployment.md)
    mode: otp                    # none | otp | header
    session_secret: ${SECMAIL_SESSION_SECRET}   # >= 32 chars, signs the session cookie
    session_ttl: 12h
    allow_domain_users: false    # true: any user of smtp.accepted_domains (distribution lists)
    otp_from: no-reply@example.com
    otp_ttl: 10m
    otp_max_attempts: 5
    otp_resend_after: 1m
    # trusted_header: X-Auth-Request-Email   # header mode (SSO reverse proxy)

internal_api:                    # used by the external analysis engine only
  listen: "0.0.0.0:8081"
  token: ${SECMAIL_INTERNAL_TOKEN}
  advertise_url: http://secmail-internal.example.com:8081
  admin_token: ${SECMAIL_ADMIN_TOKEN}   # DLP admin endpoints (/internal/v1/dlp/*); must differ from token

storage:
  type: s3                       # s3 (AWS S3 / MinIO / RustFS / Ceph RGW) | fs
  s3:
    endpoint: minio.internal.example.com:9000
    region: us-east-1
    bucket: secmail-attachments
    access_key: ${SECMAIL_S3_ACCESS_KEY}
    secret_key: ${SECMAIL_S3_SECRET_KEY}
    use_ssl: true
  fs:
    dir: /var/lib/secmail/objects

database:
  type: postgres                 # postgres | memory
  dsn: ${SECMAIL_DATABASE_DSN}   # postgres://user:pass@host:5432/secmail?sslmode=require

redis:
  addr: redis.internal.example.com:6379
  password: ${SECMAIL_REDIS_PASSWORD}
  db: 0

queue:
  type: redis                    # redis | memory
  key_prefix: secmail

analysis:
  timeout: 2m                    # PENDING longer than this is re-queued
  max_attempts: 3                # then marked ERROR (download blocked, fail-closed)
  verdict_reuse_window: 24h      # reuse verdicts for identical SHA-256 (0 disables)
  janitor_interval: 1m

# ---- Outgoing mail inspection (DLP) — see docs/dlp.md ----
outbound:
  enabled: true
  listen: ":10025"                 # the internal mail server relays Internet-bound mail here
  allowed_clients:                 # only these hosts may relay (internal mail servers)
    - 10.0.5.10/32
  # sender_domains: [example.com]  # default: smtp.accepted_domains
  next_hop:                        # where inspected mail goes: Postfix re-injection port / smart host
    addr: 10.0.5.10:10026
    starttls: false
    timeout: 60s
  max_message_bytes: 52428800

dlp:
  scan_attachments: true           # docx/xlsx/pptx, hwp/hwpx, pdf, zip (nested), csv/txt, legacy doc/xls
  scan_internal: false             # true: also inspect mail between internal addresses
  actions:                         # allow | notify | hold | block
    high: hold                     # resident/alien reg. no., card no., API keys, private keys, DB credentials
    medium: notify                 # passport, driver licence, bulk phone numbers, JWT, passwords
    low: allow                     # bulk e-mail addresses (logged only)
    uninspectable: notify          # encrypted zip/PDF/Office/HWP, distribution-protected HWP
  notify_sender: true
  admins: [security@example.com]   # receive notices; approve/reject holds on the portal
  notify_from: dlp-noreply@example.com
  hold_ttl: 72h                    # undecided holds are discarded (not sent) after this
  ocr:                             # read text in images: screenshots, photos, scanned PDFs,
    enabled: true                  # pictures pasted into docx/xlsx/pptx/hwp (needs tesseract + kor data)
    command: tesseract
    languages: kor+eng
    psm: 4                         # tesseract page segmentation mode
    max_images: 20                 # distinct images per message (rest reported as uninspectable)
    min_pixels: 9000               # skip icons / logos smaller than this (w*h)
    timeout: 20s                   # per image
    total_timeout: 60s             # per message
    concurrency: 2                 # images OCR'd in parallel per message
    max_processes: 4               # tesseract processes for the whole server
  # disabled: [jwt, email_address]         # built-in detector IDs to turn off
  # min_counts: {kr_mobile: 10}            # bulk thresholds per location
  # exempt_senders: [payroll-bot@example.com]
  # exempt_recipient_domains: [payroll-partner.co.kr]   # trusted partners: logged, not held
  # rules:                                 # organisation-specific patterns
  #   - id: project_codename
  #     name: 프로젝트 코드명
  #     pattern: 'PRJ-(ORION-\d{3})'
  #     severity: high
  #     category: confidential
