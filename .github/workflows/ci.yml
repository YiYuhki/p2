name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secmail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      s3:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: testkey
          RUSTFS_SECRET_KEY: testsecret123
        ports: ["9000:9000"]
    env:
      SECMAIL_TEST_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/secmail_test?sslmode=disable
      SECMAIL_TEST_REDIS: 127.0.0.1:6379
      SECMAIL_TEST_S3_ENDPOINT: 127.0.0.1:9000
      SECMAIL_TEST_S3_ACCESS_KEY: testkey
      SECMAIL_TEST_S3_SECRET_KEY: testsecret123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: wait for S3
        run: for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
      - run: go test -count=1 -race ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t secmail .
